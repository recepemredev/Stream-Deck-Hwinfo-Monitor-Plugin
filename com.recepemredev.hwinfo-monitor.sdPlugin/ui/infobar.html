<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Infobar Carousel</title>
	<link rel="stylesheet" href="pi.css">
</head>
<body>
	<div class="field">
		<label for="style">Style</label>
		<div class="picker">
			<select id="style" data-setting="style">
				<option value="single">Single (one reading per page)</option>
				<option value="overview">Overview (three readings per page)</option>
			</select>
		</div>
	</div>

	<div class="field">
		<label for="readingCount">Readings</label>
		<select id="readingCount" data-setting="readingCount">
			<option value="1">1</option>
			<option value="2">2</option>
			<option value="3">3</option>
			<option value="4">4</option>
			<option value="5">5</option>
			<option value="6">6</option>
			<option value="7">7</option>
			<option value="8">8</option>
		</select>
	</div>

	<div class="field">
		<label>Sensor</label>
		<div class="slot-editor">
			<div id="tabs" class="tabs"></div>
			<div id="picker" class="picker"></div>
			<div class="field">
				<label for="readingLabel">Label</label>
				<input id="readingLabel" type="text" maxlength="24" placeholder="Sensor name">
			</div>
		</div>
	</div>

	<div class="field">
		<label for="cycleMs">Page time</label>
		<select id="cycleMs" data-setting="cycleMs">
			<option value="3000">3 s</option>
			<option value="5000">5 s</option>
			<option value="10000">10 s</option>
			<option value="15000">15 s</option>
		</select>
	</div>
	<div id="fields"></div>

	<script src="pi-common.js"></script>
	<script src="sensor-picker.js"></script>
	<script src="slot-tabs.js"></script>
	<script src="display-fields.js"></script>
	<script src="infobar.js"></script>
</body>
</html>
